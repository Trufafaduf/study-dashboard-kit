name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure a fallback git identity (the tests set their own per-command env too)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
        shell: bash

      - name: Fresh-clone smoke test
        run: python scripts/smoke_test.py

      - name: Submodule test
        run: python scripts/submodule_test.py

      - name: History privacy scan (no private deny-list in CI)
        run: python scripts/scan_history.py
